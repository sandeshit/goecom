name: Build & push Docker image to ACR
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  COMPOSE_FILE: docker-compose.yml
  REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image tag
        id: prep
        run: |
          IMAGE_TAG=${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "tagged_image=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      - name: Login to ACR
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ steps.prep.outputs.tagged_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Docker push
        run: docker push $IMAGE_TAG
        env:
          IMAGE_TAG: ${{ steps.prep.outputs.tagged_image }}